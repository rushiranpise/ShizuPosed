name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v3.9.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build debug and release APKs
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Stage release assets
        run: |
          mkdir -p dist
          debug_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)

          if [[ -z "$debug_apk" || -z "$release_apk" ]]; then
            echo 'Expected debug and release APKs were not found:'
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi

          cp "$debug_apk" "dist/ShizuPosed-${RELEASE_TAG}-debug.apk"
          cp "$release_apk" "dist/ShizuPosed-${RELEASE_TAG}-release.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ShizuPosed ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*.apk